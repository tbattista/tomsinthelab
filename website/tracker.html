<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Housewives Sighting Tracker</title>

  <!-- Leaflet: free, open-source maps (OpenStreetMap tiles) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    :root {
      --bg: #0f0f14;
      --panel: #17171f;
      --panel-2: #1e1e28;
      --text: #ececf1;
      --muted: #9a9ab0;
      --accent: #e6398b;
      --high: #35c46a;
      --medium: #e6b539;
      --low: #7a7a8c;
      --border: #2a2a38;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 0.3px;
    }
    header h1 span { color: var(--accent); }
    .meta { color: var(--muted); font-size: 13px; }
    button {
      margin-left: auto;
      background: var(--accent);
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled { opacity: 0.5; cursor: default; }

    .layout { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; min-width: 0; }
    .feed {
      width: 380px;
      max-width: 40vw;
      background: var(--panel);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--accent); }
    .card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .badge.show { background: rgba(230,57,139,0.18); color: var(--accent); }
    .conf { font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .conf.high { color: var(--high); }
    .conf.medium { color: var(--medium); }
    .conf.low { color: var(--low); }
    .when { color: var(--muted); font-size: 12px; margin-left: auto; }
    .summary { font-size: 14px; line-height: 1.4; margin: 4px 0 6px; }
    .loc { font-size: 12px; color: var(--muted); }
    .loc.approx::after { content: " · approx"; color: var(--low); }
    .cast { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .card a { color: var(--accent); font-size: 12px; text-decoration: none; }
    .empty { color: var(--muted); text-align: center; padding: 40px 20px; line-height: 1.5; }
    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      .feed { width: 100%; max-width: none; height: 45%; border-left: none; border-top: 1px solid var(--border); }
      #map { height: 55%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>👀 <span>Housewives</span> Sighting Tracker</h1>
    <div class="meta" id="status">Loading…</div>
    <button id="refresh">Refresh</button>
  </header>

  <div class="layout">
    <div id="map"></div>
    <div class="feed" id="feed"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CONF_COLORS = { high: '#35c46a', medium: '#e6b539', low: '#7a7a8c' };

    const map = L.map('map').setView([39.5, -98.35], 4); // continental US
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19,
    }).addTo(map);

    let markers = [];

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 3600) return Math.max(1, Math.floor(s / 60)) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    function clearMarkers() {
      markers.forEach((m) => map.removeLayer(m));
      markers = [];
    }

    function render(data) {
      const sightings = data.sightings || [];
      const feed = document.getElementById('feed');
      clearMarkers();

      // Status line
      const st = data.status || {};
      const lr = st.lastRun;
      document.getElementById('status').textContent = lr
        ? `${sightings.length} sightings · last check ${timeAgo(lr.at)}` +
          (lr.usingClaude ? '' : ' · heuristic mode')
        : `${sightings.length} sightings`;

      if (!sightings.length) {
        feed.innerHTML =
          '<div class="empty">No sightings yet.<br />Hit Refresh to poll Reddit, ' +
          'or wait for the next automatic check.</div>';
        return;
      }

      // Feed cards
      feed.innerHTML = '';
      const cardById = {};
      sightings.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">
            ${s.show ? `<span class="badge show">${s.show}</span>` : ''}
            <span class="conf ${s.confidence}">${s.confidence}</span>
            <span class="when">${timeAgo(s.postedAt)}</span>
          </div>
          <div class="summary">${escapeHtml(s.summary || '')}</div>
          ${
            s.locationResolved || s.locationText
              ? `<div class="loc ${s.approximate ? 'approx' : ''}">📍 ${escapeHtml(
                  s.locationText || s.locationResolved
                )}</div>`
              : ''
          }
          ${s.cast && s.cast.length ? `<div class="cast">${s.cast.map(escapeHtml).join(', ')}</div>` : ''}
          <div style="margin-top:8px"><a href="${s.url}" target="_blank" rel="noopener">source on r/${s.subreddit} →</a></div>
        `;
        cardById[s.sourceId] = card;
        if (s.lat != null && s.lng != null) {
          card.addEventListener('click', () => {
            map.setView([s.lat, s.lng], 11);
          });
        }
        feed.appendChild(card);
      });

      // Map markers
      const bounds = [];
      sightings.forEach((s) => {
        if (s.lat == null || s.lng == null) return;
        const marker = L.circleMarker([s.lat, s.lng], {
          radius: s.approximate ? 7 : 9,
          color: CONF_COLORS[s.confidence] || CONF_COLORS.low,
          fillColor: CONF_COLORS[s.confidence] || CONF_COLORS.low,
          fillOpacity: s.approximate ? 0.35 : 0.75,
          weight: 2,
        }).addTo(map);
        marker.bindPopup(
          `<strong>${s.show || 'Sighting'}</strong> · ${s.confidence}<br/>` +
            `${escapeHtml(s.summary || '')}<br/>` +
            `<small>${timeAgo(s.postedAt)} · ${s.approximate ? 'approx location' : 'reported location'}</small><br/>` +
            `<a href="${s.url}" target="_blank" rel="noopener">source →</a>`
        );
        markers.push(marker);
        bounds.push([s.lat, s.lng]);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 9 });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
      );
    }

    async function load() {
      const res = await fetch('/api/sightings');
      render(await res.json());
    }

    document.getElementById('refresh').addEventListener('click', async () => {
      const btn = document.getElementById('refresh');
      btn.disabled = true;
      btn.textContent = 'Checking…';
      try {
        const res = await fetch('/api/refresh', { method: 'POST' });
        render(await res.json());
      } catch (e) {
        alert('Refresh failed: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Refresh';
      }
    });

    load();
    setInterval(load, 60 * 1000); // auto-refresh the view every minute
  </script>
</body>
</html>
